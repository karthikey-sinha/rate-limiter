services:
  redis:
    image: redis:7-alpine
    container_name: ratelimiter_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: ratelimiter_app
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped